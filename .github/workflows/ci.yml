name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # `npm ci`, not `npm install`: two builds of one commit must resolve the same
      # dependencies, and the lockfile is what guarantees it.
      - run: npm ci
      # Two configs per package: the published source deliberately has no node types (a
      # browser SDK whose source can reach `node:fs` is one that eventually does), and the
      # tests get them through `tsconfig.test.json`.
      - run: npm run typecheck
      - run: npm test
      # **The only check that exercises what npm will actually serve.** Everything above
      # resolves a package through this repository's own module graph, so it proves the
      # source works and says nothing about the artefact. This builds each package, packs
      # it, installs the tarball into a throwaway consumer and imports from it under ESM,
      # CJS and two TypeScript module resolutions. A broken `exports` map installs
      # silently and fails at the consumer's first import, which is publish day.
      - run: npm run verify:package

  # @hermesihq/node promises Node 20 and later, and the job above only runs 22. Its tests talk to a
  # real HTTP server on localhost, so they exercise the runtime's own `fetch`, which is exactly the
  # part that differs between releases.
  node-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci
      - run: npm test -w @hermesihq/node

  # A real Next.js App Router application, built and run against the packed packages. The packages job
  # proves the artefact installs and imports; only a `next build` shows whether a Server Component can
  # import it (it could not, for want of a 'use client' directive) and whether the Node package runs in a
  # Route Handler on the Edge runtime. Next 14 (React 18), 15 and 16 (React 19), and for 16 both bundlers,
  # because applications still use both. App Router only.
  nextjs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { next: 14, bundler: webpack }
          - { next: 15, bundler: webpack }
          - { next: 16, bundler: turbopack }
          - { next: 16, bundler: webpack }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: node scripts/next-smoke.mjs --next=${{ matrix.next }} --bundler=${{ matrix.bundler }}

  # The packages job proves the source and the artefact; this proves what a person sees. It runs
  # the built components in Chromium, Firefox and WebKit against a mock of the client API. jsdom
  # has no layout, no cascade and no real focus model, and two defects shipped through it.
  e2e:
    runs-on: ubuntu-latest
    # Two runs once sat for 25 minutes in the engine download with nothing to show for it, and a
    # job that waits forever looks like a job that is still running. The suite takes about three
    # minutes; this is for the day the network does not.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Engines are fetched at the version the lockfile pinned, with the system libraries they
      # need. Not cached: a stale engine is a result that disagrees with a person's browser.
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: e2e
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
